<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Nexora Student Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;805&family=Outfit:wght@800&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #020617;
        color: #f1f5f9;
        font-family: 'Inter', system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        text-align: center;
      }
      .container {
        max-width: 500px;
        padding: 40px;
        background: rgba(9, 15, 29, 0.65);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(6, 182, 212, 0.2);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 15px rgba(6, 182, 212, 0.1);
        border-radius: 24px;
      }
      h1 {
        font-family: 'Outfit', sans-serif;
        font-size: 72px;
        margin: 0;
        background: linear-gradient(to right, #06b6d4, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h2 {
        font-size: 20px;
        margin-top: 10px;
        color: #e2e8f0;
      }
      p {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.6;
        margin: 20px 0 30px;
      }
      a {
        display: inline-block;
        padding: 12px 28px;
        background: linear-gradient(to right, #06b6d4, #2563eb);
        color: white;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
        transition: all 0.3s;
      }
      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
      <a href="/">Return to Nexora Student Hub</a>
    </div>
  </body>
</html>
